[project]
name = "react-search-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vaishnavi9", email = "vaishnavidhanwade.vd@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "langchain-openai>=1.4.1",
